# Nome do Workflow do GitHub Action
name: Generate Snake Animation

# Controles de quando a action será executada
on:
  # Executa automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # Permite que você execute este workflow manualmente na aba Actions
  workflow_dispatch:

# Uma sequência de tarefas que serão executadas
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Gera a animação da cobrinha
      - uses: Platane/snk@v3
        with:
          # Seu nome de usuário do GitHub (pega automaticamente)
          github_user_name: ${{ github.repository_owner }}

          # Lista de arquivos de saída
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Envia os arquivos gerados para o repositório
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: main # ou master, dependendo da sua branch principal
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
